[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-node-graph-routing-simulation"
version = "0.1.0"
description = "A deterministic graph-only simulation comparing a three-node network with and without a shortcut edge."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = []

[project.scripts]
three-node-sim = "membrane_sim.cli:main"

[tool.setuptools]
packages = ["membrane_sim"]
